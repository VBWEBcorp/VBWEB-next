# Redirections 301 permanentes : consultant-seo-rennes.fr -> vbweb.fr
# Transfert d'autorite SEO de l'ancien NDD vers le nouveau.
# Le :splat capture le path apres le domaine et le replace dans la nouvelle URL.

[[redirects]]
  from = "https://consultant-seo-rennes.fr/*"
  to = "https://vbweb.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.consultant-seo-rennes.fr/*"
  to = "https://vbweb.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://consultant-seo-rennes.fr/*"
  to = "https://vbweb.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.consultant-seo-rennes.fr/*"
  to = "https://vbweb.fr/:splat"
  status = 301
  force = true

# NOTE : la canonicalisation www <-> apex est geree nativement par
# Netlify via "Primary domain" dans Domain settings. Ne pas la dupliquer
# ici sinon -> ERR_TOO_MANY_REDIRECTS.

# ============================================================
# REDIRECTIONS 301 — de-localisation des URLs (suppression de "-rennes")
# Les anciennes URLs pointent vers les nouvelles pages nationales.
# ============================================================
[[redirects]]
  from = "/referencement-seo-rennes"
  to = "/consultant-seo-rennes"
  status = 301
  force = true

[[redirects]]
  from = "/referencement-local-rennes"
  to = "/referencement-local"
  status = 301
  force = true

[[redirects]]
  from = "/freelance-seo-rennes"
  to = "/consultant-seo-rennes"
  status = 301
  force = true

